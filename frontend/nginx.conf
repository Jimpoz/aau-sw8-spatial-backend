server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/geo+json
        application/javascript
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://middleware:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Map-Maker 1;
        proxy_set_header Accept-Encoding "";   # let nginx choose the encoding
        proxy_read_timeout 900s;
        client_max_body_size 200m;

        # The default proxy_buffer is 8k — anything bigger gets spooled
        # to /var/cache/nginx/proxy_temp on disk (you'll see the warning
        # in the log). Pumping the buffer pool up lets the 10-35 MB
        # responses stream through RAM instead.
        proxy_buffers 32 64k;
        proxy_buffer_size 64k;
        proxy_busy_buffers_size 256k;

        # WebSocket upgrade for /api/v1/ml-vision/ws/stream/...
        # (needs the upgrade header pair preserved end-to-end).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /health {
        proxy_pass http://middleware:8080/health;
    }
}
